[project]
name = "fitness-dashboard"
version = "0.1.0"
description = "Personal local-first fitness dashboard"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "lxml>=5.0.0",
    "gpxpy>=1.6.0",
    "httpx>=0.27.0",
    "streamlit>=1.36.0",
    "plotly>=5.20.0",
    "pydantic>=2.0.0",
    "pytz>=2026.1.post1",
    "fitdecode>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
